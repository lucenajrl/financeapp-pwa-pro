};

});

<body>
<!-- ═══ AUTH SCREEN ═══ -->
<div id="authScreen">
  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-ic">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div class="auth-logo-nm">FinanceApp</div>
      <div class="auth-logo-sub">PRO</div>
    </div>
    <div class="auth-card">
      <div id="authErr" class="auth-err"></div>
      <!-- LOGIN -->
      <div id="viewLogin">
        <div class="auth-title">Bem-vindo de volta</div>
        <div class="auth-sub">Entre com sua conta para continuar</div>
        <div class="auth-fi"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email"></div>
        <div class="auth-fi"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"></div>
        <button class="auth-btn" onclick="authLogin()">Entrar</button>
        <div class="auth-switch">Não tem conta? <span onclick="authToggle('cadastro')">Cadastre-se</span></div>
      </div>
      <!-- CADASTRO -->
      <div id="viewCadastro" style="display:none">
        <div class="auth-title">Criar conta</div>
        <div class="auth-sub">Preencha os dados para começar</div>
        <div class="auth-fi"><label>Nome</label><input type="text" id="cadNome" placeholder="Seu nome" autocomplete="name"></div>
        <div class="auth-fi"><label>E-mail</label><input type="email" id="cadEmail" placeholder="seu@email.com" autocomplete="email"></div>
        <div class="auth-fi"><label>Senha</label><input type="password" id="cadPass" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
        <div class="auth-fi"><label>Confirmar Senha</label><input type="password" id="cadPass2" placeholder="Repita a senha" autocomplete="new-password"></div>
        <button class="auth-btn" onclick="authCadastro()">Criar Conta</button>
        <div class="auth-switch">Já tem conta? <span onclick="authToggle('login')">Entrar</span></div>
      </div>
    </div>
  </div>
</div>
